[package]
name = "torex_store"
version = "0.1.0"
edition = "2021"
description = "TOREX Storage - High-performance embedded database engine"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "2.12.0"
serde = { version = "1", features = ["derive"] }
bincode = "1"
crc32fast = "1"
parking_lot = "0.12"
dashmap = "6"
crossbeam-channel = "0.5"
log = "0.4"
chrono = "0.4"
bitflags = { version = "2", features = ["serde"] }
once_cell = "1"
